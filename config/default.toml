# Desktop Voice Orchestrator 默认配置（第二部分）
#
# 单位统一使用 Hz、ms、样本数和百分比。标记“热”的参数可由调试台立即应用；
# 标记“冷”的参数会保存到 local.toml，但需要重启进程后生效。

[audio]
# 冷：WASAPI endpoint ID；default 表示跟随系统默认设备。
microphone_device = "default"
loopback_device = "default"
# 冷：默认设备改变时是否自动重连。
follow_default_device = true
# 固定：KWS、VAD、AEC输出、ASR和环形缓冲统一使用16 kHz单声道。
target_sample_rate = 16000
frame_ms = 10
# 固定容量采集队列，合法范围500..10000 ms；溢出会重置状态而不会阻塞采集线程。
queue_capacity_ms = 2000

[preprocess]
# 冷：webrtc_aec3 或 bypass。未编译WebRTC时会明确降级到旁路。
implementation = "webrtc_aec3"
aec_enabled = true

[aec]
enabled = true
# 冷：第二部分固定16 kHz；以后可基于真实数据评估32/48 kHz。
processing_rate_hz = 16000
high_pass_filter = true
# 冷：本阶段关闭NS/AGC，以便单独评估AEC效果。
noise_suppression = false
gain_control = false
# 冷：优先请求原始麦克风和音量/静音之后的loopback；不支持时自动回退并产生事件。
request_raw_capture = true
request_post_volume_loopback = true
# 热：等待同时间轴render包的最大时间，范围0..100 ms。
alignment_wait_ms = 30
# 热：render FIFO目标/上限；目标至少10 ms，上限范围100..2000 ms。
target_render_buffer_ms = 60
max_render_buffer_ms = 500
# 热：设备时钟斜率估计窗口和允许的最大相对漂移。
drift_window_ms = 5000
max_drift_ppm = 1000
# 热：对齐误差超过该值时硬重置AEC、KWS、VAD和待定候选。
hard_resync_error_ms = 80
# 热：实验用软件延迟偏置，单位ms。
delay_offset_ms = 0
# 热：多通道原始麦克风的通道选择；0..31选择对应通道，-1才对全部通道求平均。
# 默认选择通道0，避免阵列通道时差或反相导致算术平均相消人声。
microphone_channel_index = 0
# 热：基于真实loopback与原始麦克风的归一化互相关估计外部回声延迟。
# 只有render能量和相关峰达到门槛时才更新；最终提示值=自动估计+delay_offset_ms。
auto_delay_enabled = true
auto_delay_min_ms = 0
auto_delay_max_ms = 250
# 热：分析窗口500..5000 ms；更新间隔100..窗口长度ms。窗口越长越稳但收敛越慢。
auto_delay_window_ms = 1000
auto_delay_update_ms = 500
# 热：相关峰门槛0.10..0.95；提高可减少近端说话造成的错误更新。
auto_delay_min_correlation = 0.35
# 固定：参考流不可用时输出旁路mic，同时重置AEC并标记degraded。
missing_render_policy = "bypass_reset"
# 热：AEC统计推送频率，范围1..20 Hz。
stats_hz = 1

[ring]
# 冷：内存音频保留时长，范围1000..120000 ms；默认20秒。
duration_ms = 20000

[kws]
enabled = true
# 冷：sherpa-onnx v1.13.2 中英Zipformer KWS chunk-16模型。
encoder = "models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx"
decoder = "models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/decoder-epoch-13-avg-2-chunk-16-left-64.onnx"
joiner = "models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx"
tokens = "models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/tokens.txt"
lexicon = "models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/en.phone"
keywords = "config/keywords.txt"
provider = "cpu"
num_threads = 1
max_active_paths = 4
num_trailing_blanks = 1
# 热：关键词路径加分，建议范围0..20。
boosting_score = 1.0
# 热：KWS命中阈值，范围0..1。
threshold = 0.25
# 冷：二级唤醒。未激活时，没有KWS命中的语音段交给整句识别模型（asr.final_decoder）检查是否含唤醒词；
# 命中后走与KWS相同的候选、识别和严格解析流程。未命中的识别文本不会发布或记录。
asr_probe = true
# 冷：探测使用的音频："microphone"（原始麦克风，音乐播放时更可靠）或 "aec"。
asr_probe_source = "microphone"
# 冷：只探测不长于此时长的语音段（毫秒），避免持续解码长段音乐。
asr_probe_max_ms = 8000

[vad]
enabled = true
model = "models/silero_vad.int8.onnx"
provider = "cpu"
num_threads = 1
# 热：语音概率阈值，范围0..1。语音在概率低于 threshold-0.15 持续 min_silence_ms 后才结束；
# 0.25 时房间底噪和按键声会让一段语音拖到下一句，把相邻命令并成一个候选（2026-09-24 实测）。
threshold = 0.5
window_size = 512
min_speech_ms = 150
min_silence_ms = 600
max_speech_ms = 18000

[segmentation]
# 热：KWS token区间两侧额外剔除范围。
wake_guard_ms = 100
pre_roll_ms = 150
# Keep the complete VAD endpoint decision window in exact-final ASR so weak
# command tails are not lost after appearing in streaming partials.
post_roll_ms = 900
endpoint_silence_ms = 900
max_candidate_ms = 18000
min_command_speech_ms = 250
# 热：embedded候选左右PCM之间插入的静音。
embedded_join_silence_ms = 150
# 冷：候选/ASR前置音频异步组装的总在途上限，合法范围1..64；队列满时显式取消且不反压音频线程。
assembly_queue_capacity = 4

[activation]
# 热：KWS命中后允许免唤醒后续命令；期限使用处理后的16kHz样本时钟。
enabled = true
idle_timeout_ms = 6000
hard_limit_ms = 20000

[asr]
enabled = true
# 冷：使用现有sherpa-onnx运行FunASR来源、带sherpa元数据的在线Paraformer重导出。
implementation = "sherpa_online_paraformer"
encoder = "models/sherpa-onnx-streaming-paraformer-zh/encoder.int8.onnx"
decoder = "models/sherpa-onnx-streaming-paraformer-zh/decoder.int8.onnx"
tokens = "models/sherpa-onnx-streaming-paraformer-zh/tokens.txt"
provider = "cpu"
num_threads = 1
# 热：实时会话每次投递的音频块，范围10..1000 ms且必须是10的倍数。
feed_chunk_ms = 100
max_active_streams = 2
# 固定有界队列；满时取消候选，绝不阻塞实时音频路径。
queue_capacity = 512
max_pending_audio_ms = 60000
# 热：部分文本只用于调试展示，永不执行命令。
emit_partials = true
# 固定：候选完成后，用包含完整连续话语的PCM重新解码一次作为权威结果；解析前再剥离唤醒词文本。
exact_final_redecode = true
# 冷：权威整句识别使用非流式模型。流式Paraformer对解码起点敏感，会丢句尾字；
# 在52条标注录音上，命令正确数从22提高到31（SenseVoice）。"streaming" 恢复旧行为。
# 上面的流式模型仍用于调试台的实时部分文本。
final_decoder = "sense_voice"
final_model = "models/sherpa-onnx-sense-voice-funasr-nano-int8-2025-12-17/model.int8.onnx"
final_tokens = "models/sherpa-onnx-sense-voice-funasr-nano-int8-2025-12-17/tokens.txt"
# 冷：主识别文本解析失败时，才改用此模型的文本；它同样必须完整匹配命令语法。"none" 关闭。
fallback_decoder = "zipformer_ctc"
fallback_model = "models/sherpa-onnx-zipformer-ctc-zh-int8-2025-07-03/model.int8.onnx"
fallback_tokens = "models/sherpa-onnx-zipformer-ctc-zh-int8-2025-07-03/tokens.txt"

[commands]
enabled = true
# 热：未口述数值时调整的Windows音量滑块百分点。
default_volume_step_percent = 5
# 热：口述相对幅度上限；合法范围1..20，超范围整句拒绝。
max_spoken_volume_step_percent = 20
max_actions_per_utterance = 8
# 冷：GSMTC异步调用的整次动作截止时间；超时会取消WinRT操作并产生action_failed/action_timeout。
# Core Audio音量接口为同步COM调用，无法安全抢占，只记录实际耗时。
action_timeout_ms = 2000
# 冷：有界动作队列容量；修改后重启生效。
queue_capacity = 32
# 热：多命令连接词；命令也允许直接相邻或以常见标点分隔。
connectors = ["然后再", "然后", "再", "后", "接着", "并且", "以及", "和", "还有"]

[commands.phrases]
# 热：配置项仍定义动作语义；解析器允许唯一的一字漏识别纠正。
play = ["播放音乐", "打开音乐"]
pause = ["暂停音乐"]
volume_up = ["增加音量"]
volume_down = ["降低音量"]

[announcements]
# 当前仅实现结构化文字日志；未来TTS后端复用同一非阻塞接口。
enabled = true
backend = "log"
queue_capacity = 32
barge_in = false
tail_guard_ms = 200

[web]
enabled = true
# 冷：调试服务只允许绑定本机回环地址。
bind = "127.0.0.1"
port = 8765
# 热：JSON遥测刷新率，范围1..60 Hz。
telemetry_hz = 20
static_root = "web"

[recording]
# 冷：只有用户在调试台显式开始录制后才会写盘。
session_root = "data/sessions"
# 固定容量异步写盘队列；溢出会标记会话不完整，不阻塞音频处理。
queue_capacity_ms = 5000
